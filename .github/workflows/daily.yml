name: Caso del día

# 05:05 UTC = 00:05 en Bogotá. Genera el caso con Claude, lo pasa por el arnés,
# lo publica si aprueba (o deja el caso del banco como fallback) y reconstruye el sitio.
# GitHub retrasa u omite crons: 07:05 y 10:05 UTC son respaldos (run.ts sale si el caso de hoy ya existe).
# La fecha visible no depende de esto: la elige el navegador (CA-002.8).
on:
  schedule:
    - cron: '5 5 * * *'
    - cron: '5 7 * * *'
    - cron: '5 10 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Generar y evaluar el caso
        run: npm run daily
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STOA_MODELO: ${{ vars.STOA_MODELO || 'claude-opus-5-5' }}
      - name: Validar todo el contenido
        run: npm run validate:content
      - name: Guardar en el repositorio
        run: |
          git config user.name "stoa-bot"
          git config user.email "stoa-bot@users.noreply.github.com"
          git add src/content/casos/diarios docs/registro-diario.md
          git diff --cached --quiet || git commit -m "Caso del día $(TZ=America/Bogota date +%F)"
          git push

  publicar:
    needs: generar
    uses: ./.github/workflows/deploy.yml
